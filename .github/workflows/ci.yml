name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Ruff check
        run: ruff check src/ tests/
      - name: Mypy
        run: mypy src/ --ignore-missing-imports
      - name: Custom linters
        run: bash .claude/lint_all.sh

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Unit tests
        run: pytest tests/unit/ -m unit -v --tb=short
      - name: Integration tests
        run: pytest tests/integration/ -m integration -v --tb=short
      - name: Coverage check
        run: pytest tests/unit/ tests/integration/ -m "unit or integration" --cov=src --cov-report=term-missing --cov-fail-under=80

  test-e2e:
    runs-on: ubuntu-latest
    needs: test
    if: hashFiles('tests/e2e/') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Install Playwright browsers
        run: playwright install --with-deps chromium
      - name: Start application
        run: |
          make run &
          sleep 5
      - name: Wait for health check
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && break || sleep 2
          done
      - name: E2E tests
        run: pytest tests/e2e/ -m e2e -v --tb=short
