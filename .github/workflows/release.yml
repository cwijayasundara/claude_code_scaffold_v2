name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t ${{ github.event.repository.name }}:${{ github.ref_name }} .
      - name: Tag as latest
        run: docker tag ${{ github.event.repository.name }}:${{ github.ref_name }} ${{ github.event.repository.name }}:latest
